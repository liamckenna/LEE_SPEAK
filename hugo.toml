# Basic config
baseURL = "https://leespeak.me/"
theme = "hugo-simple"
languageCode = "en"                # zh-Hans
title = "LEE_SPEAK"
copyright = "© 2026 Liam McKenna"
# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# https://github.com/gohugoio/hugo/issues/12152
capitalizeListTitles = false

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
disableKinds = ["taxonomy"]
# ignoreErrors = ["error-disable-taxonomy"]
[taxonomies]
tag = "tags"

[permalinks]
posts = "/:slug/"
tags = "/tags/:slug/"

[markup.goldmark.renderer]
unsafe = true
[markup.tableOfContents]
startLevel = 2
endLevel = 3
[markup.highlight]
lineNos = true
lineNumbersInTable = false
noClasses = true
style = "catppuccin-mocha"

[params]
description = "A blog about gaming, art, candy, and internet culture."
favicon = "images/favicon.png"
dateFormat = "Jan. 2, 2006"
hideMadeWithLine = true
hideRSSLink = true

[params.author]
name = "Liam McKenna"
email = "lee@liamdouglas.com"

[[menu.main]]
name = "Home"
pageRef = "/"
weight = 10


[services.rss]
limit = 42

[pagination]
pagerSize = 16

[outputs]
# Generate RSS for home only.
taxonomy = ["html"]
term = ["html"]
home    = ["HTML","RSS"]
section = ["HTML","RSS"]

